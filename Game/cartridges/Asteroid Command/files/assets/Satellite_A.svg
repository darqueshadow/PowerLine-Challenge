<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" width="128" height="96" shape-rendering="crispEdges">
  <!-- VARIANT A — boxy / utilitarian. Faces right; engine mirrors for left runs. -->

  <!-- Tow hardpoint — the banner cable is drawn from exactly (0,48) -->
