  <rect x="0" y="43" width="8" height="2" fill="#a4d5ff" />
  <rect x="2" y="47" width="3" height="3" fill="#121e36" />
  <rect x="8" y="47" width="22" height="2" fill="#8ca0b8" />
  <rect x="8" y="49" width="22" height="1" fill="#323f51" />

  <!-- Top Solar Wing -->
  <rect x="44" y="33" width="4" height="8" fill="#8ca0b8" />
  <rect x="38" y="9" width="16" height="2" fill="#a4d5ff" />
  <rect x="38" y="11" width="16" height="20" fill="#3b63a0" />
  <rect x="38" y="31" width="16" height="2" fill="#1b2f5b" />
  <rect x="40" y="13" width="5" height="7" fill="#121e36" />
  <rect x="47" y="13" width="5" height="7" fill="#121e36" />
  <rect x="40" y="22" width="5" height="7" fill="#121e36" />
  <rect x="47" y="22" width="5" height="7" fill="#121e36" />

