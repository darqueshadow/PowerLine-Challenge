  <rect x="74" y="39" width="4" height="4" fill="#a4d5ff" />
  <rect x="74" y="51" width="4" height="4" fill="#a4d5ff" />

  <!-- Beacon mast — the engine paints its blinking red lamp on top at (72,5) -->
  <rect x="70" y="8" width="4" height="34" fill="#8ca0b8" />
  <rect x="70" y="8" width="4" height="2" fill="#e2efff" />

