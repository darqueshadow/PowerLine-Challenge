  <rect x="44" y="55" width="4" height="8" fill="#50627c" />
  <rect x="38" y="63" width="16" height="2" fill="#a4d5ff" />
  <rect x="38" y="65" width="16" height="20" fill="#3b63a0" />
  <rect x="38" y="85" width="16" height="2" fill="#1b2f5b" />
  <rect x="40" y="67" width="5" height="7" fill="#121e36" />
  <rect x="47" y="67" width="5" height="7" fill="#121e36" />
  <rect x="40" y="76" width="5" height="7" fill="#121e36" />
  <rect x="47" y="76" width="5" height="7" fill="#121e36" />

  <!-- Central Bus -->
  <rect x="30" y="41" width="32" height="2" fill="#ffffff" />
  <rect x="30" y="43" width="32" height="8" fill="#e2efff" />
  <rect x="30" y="51" width="32" height="2" fill="#8ca0b8" />
