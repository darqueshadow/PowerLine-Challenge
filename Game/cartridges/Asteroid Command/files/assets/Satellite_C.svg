<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" width="128" height="96" shape-rendering="crispEdges">
  <!-- VARIANT C — long / sleek, extended wings. Faces right; engine mirrors for left runs. -->

  <!-- Tow hardpoint — the banner cable is drawn from exactly (0,48) -->
  <rect x="0" y="43" width="8" height="10" fill="#50627c" />
  <rect x="0" y="43" width="8" height="2" fill="#a4d5ff" />
  <rect x="2" y="47" width="3" height="3" fill="#121e36" />
  <rect x="8" y="47" width="24" height="2" fill="#8ca0b8" />
  <rect x="8" y="49" width="24" height="1" fill="#323f51" />

  <!-- Hull — absent from the source fragment, which left the nose and tail
       caps floating with a 46-unit gap between the wings -->
  <rect x="36" y="43" width="48" height="2" fill="#ffffff" />
  <rect x="36" y="45" width="48" height="6" fill="#e2efff" />
  <rect x="36" y="51" width="48" height="2" fill="#8ca0b8" />
  <rect x="44" y="46" width="7" height="4" fill="#1b2f5b" />
  <rect x="56" y="46" width="7" height="4" fill="#3b63a0" />

  <!-- Tail cap and nose cone -->
  <rect x="32" y="46" width="4" height="4" fill="#50627c" />
  <rect x="82" y="46" width="6" height="4" fill="#e2efff" />
  <rect x="88" y="47" width="4" height="2" fill="#ffffff" />

  <!-- Top Extended Wing -->
  <rect x="42" y="37" width="34" height="7" fill="#1b2f5b" />
  <rect x="40" y="35" width="38" height="2" fill="#a4d5ff" />
  <rect x="40" y="37" width="2" height="7" fill="#a4d5ff" />
  <rect x="76" y="37" width="2" height="7" fill="#3b63a0" />
  <rect x="44" y="38" width="6" height="5" fill="#3b63a0" />
  <rect x="52" y="38" width="6" height="5" fill="#3b63a0" />
  <rect x="60" y="38" width="6" height="5" fill="#3b63a0" />
  <rect x="68" y="38" width="6" height="5" fill="#3b63a0" />

  <!-- Bottom Extended Wing -->
  <rect x="42" y="54" width="34" height="7" fill="#1b2f5b" />
  <rect x="40" y="61" width="38" height="2" fill="#3b63a0" />
  <rect x="40" y="54" width="2" height="7" fill="#a4d5ff" />
  <rect x="76" y="54" width="2" height="7" fill="#3b63a0" />
  <rect x="44" y="55" width="6" height="5" fill="#3b63a0" />
  <rect x="52" y="55" width="6" height="5" fill="#3b63a0" />
  <rect x="60" y="55" width="6" height="5" fill="#3b63a0" />
  <rect x="68" y="55" width="6" height="5" fill="#3b63a0" />

  <!-- Beacon mast — the engine paints its blinking red lamp on top at (72,5) -->
  <rect x="70" y="6" width="4" height="32" fill="#8ca0b8" />
  <rect x="70" y="6" width="4" height="2" fill="#e2efff" />

  <!-- High-gain forward needle antenna -->
  <rect x="92" y="47" width="20" height="2" fill="#e2efff" />
  <rect x="112" y="46" width="4" height="4" fill="#a4d5ff" />
</svg>
