<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Asteroid Command</title>

  <!-- Screen. Deep space rather than pure black, so the icon still reads as a
       solid tile against a dark browser theme. -->
  <rect width="32" height="32" rx="4" fill="#0a0d13"/>

  <!-- ── The rock ──────────────────────────────────────────────────────────
       Faceted, not shaded: a hard terminator splits it into a lit half and a
       shadow half with nothing in between. That single high-contrast edge is
       what still gives it volume once this is 16 pixels wide — a soft gradient
       at that size just turns to mud. -->
  <g>
    <!-- lit half, light from the upper left -->
    <polygon points="23,7 16,4 9,8 4,16 8,23" fill="#dccbb0"/>
    <!-- shadow half -->
    <polygon points="23,7 28,15 24,24 15,28 8,23" fill="#4a3f36"/>
    <!-- one mid-tone facet to break up the lit side -->
    <polygon points="9,8 4,16 8,23 13,17" fill="#ab967c"/>
    <!-- a single crater, big enough to survive the downscale -->
    <circle cx="12" cy="11" r="2.1" fill="#9a866c"/>
  </g>

  <!-- ── Targeting lock ────────────────────────────────────────────────────
       Four corner brackets — the part that has to survive 16px, so they are
       3 units thick and sit hard against the edges. Phosphor green, the one
       colour the whole PLC shell shares. -->
  <g fill="#33ff66">
    <path d="M2 2h8v3H5v5H2z"/>
    <path d="M30 2v8h-3V5h-5V2z"/>
    <path d="M2 30v-8h3v5h5v3z"/>
    <path d="M30 30h-8v-3h5v-5h3z"/>
  </g>
</svg>
