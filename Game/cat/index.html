<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tommodore CAT — PowerLine Challenge</title>
<link rel="icon" href="data:,"><!-- empty icon: no favicon ships, this suppresses the default 404 -->
<!--
  ===========================================================================
  THE CAT COMPUTER TERMINAL — the Arcade landing screen inside Fang Rock.

  Reached by `fangrock://arcade`. The shell reads the room off that url and
  resolves it from its own config.json; this page is that room's destination.
  🚨 Before 2026-09-06 the shell threw the room away at both entry points, so
  every fangrock:// link opened Morbius. If you are reading this because the
  Arcade opened Morbius again, the fault is in Morbius/shell/main.js, not here
  — and `node verify-routing.cjs` in that folder will say so in one run.

  🚫 NOTHING IS FETCHED. No webfont, no CDN, no remote asset. This runs off a
  file:// origin inside an Electron shell on a CAD workstation; anything
  remote is a thing that breaks when the network is not there.

  🚫 No literal Commodore branding. The machine is a TOMMODORE CAT — the look
  is the tribute, the trademarked words are not reproduced (core spec, Boot
  Screen Text).
  ===========================================================================
-->
<link rel="stylesheet" href="cat.css">
</head>
<body>

<div id="cat">

<!-- ---- the machine ------------------------------------------------------
     The screen and the deck, wrapped so they stay one column while the crates
     take the other. ⚠️ This wrapper is what keeps `#cat` a TWO-COLUMN grid
     without the deck and the screen becoming independent grid children — they
     are one object and must rise and fall together. -->
<div id="machine">

  <!-- ---- the screen ---------------------------------------------------- -->
  <div id="screen-shell">
    <div id="screen" class="booting">
      <!-- The terminal transcript. aria-live so a screen reader hears the
           machine answer, which is the whole interface here. -->
      <div id="out" role="log" aria-live="polite" aria-label="CAT terminal"></div>

      <!-- The live input line. Blind typing is a first-class surface: a player
           can type LOAD"PITSTOP",8,1 without ever opening the directory. -->
      <div id="line">
        <span aria-hidden="true">&gt;&nbsp;</span><span id="typed"></span><span id="caret" aria-hidden="true"></span>
      </div>

      <div id="crt" aria-hidden="true"></div>
    </div>
  </div>

  <!-- ---- the deck ------------------------------------------------------ -->
  <div id="deck">

    <div id="deck-top">
      <!-- 🚨 SINGLE EXECUTION PATH. These buttons do not have their own
           behaviour: each one submits the exact command string a player could
           have typed, through the same resolver. A button and its typed
           equivalent must always produce the identical on-screen sequence. -->
      <button class="btn" id="btn-load" type="button" data-cmd='LOAD"*",8,1'>Load&nbsp;"*",8,1</button>
      <button class="btn" id="btn-list" type="button" data-cmd='LOAD"$",8'>List&nbsp;&mdash;&nbsp;Load&nbsp;"$",8</button>
      <button class="btn" id="btn-insert" type="button" disabled>Insert&nbsp;Disk</button>
      <button class="btn" id="btn-eject" type="button" disabled>Eject</button>

      <div id="drive">
        <span id="drive-led" aria-hidden="true"></span>
        <span>Drive&nbsp;8</span>
        <span id="drive-slot" role="status">&ndash;&ndash;&nbsp;empty&nbsp;&ndash;&ndash;</span>
      </div>
    </div>

  </div>
</div><!-- /#machine -->

<!-- ---- the crates ------------------------------------------------------
     The disk box, moved out of the deck and onto the LEFT of the machine,
     and split in two. Two crates because there are already two SOURCES: the
     PLC cartridges are hand-written in disks.js, the cracked disks are
     discovered at runtime by library.js off a directory listing.

     🚨 THIS REVERSES A STATED DECISION, AND THAT IS DELIBERATE. cat.js used to
     merge both into one sorted list under the comment "a cartridge and a disk
     are peers here". They are not peers any more - his call, 2026-09-10. The
     old comment is gone rather than left to contradict this.

     Records lie on top of each other and the selected one comes forward. The
     A-Z tabs are the crate dividers, and they are the answer to a real problem:
     55 disks is far too many to reach by flipping one at a time.
     🚫 The tabs are CLICKED, never typed. The hub's terminal owns the keyboard
     - blind typing a LOAD command is a first-class surface - so a type-ahead
     here would fight it for every keystroke. -->
<div id="crates">
  <div class="crate" id="crate-plc">
    <div class="crate__label" id="crate-plc-label">CAD &mdash; PowerLine</div>
    <div class="crate__stack" role="group" aria-labelledby="crate-plc-label"></div>
  </div>

  <div class="crate" id="crate-lib">
    <div class="crate__label" id="crate-lib-label">Cracked</div>
    <!-- populated by cat.js: only letters that actually have a disk -->
    <div class="crate__tabs" role="group" aria-label="Jump to letter"></div>
    <div class="crate__stack" role="group" aria-labelledby="crate-lib-label"></div>
  </div>

  <!-- ---- the detail panel ---------------------------------------------
       🚨 Its honest state is the COMMON one: 55 of 59 disks have no
       screenshot and no synopsis, and it says so in words rather than
       showing an empty frame that reads as a broken image. See games.js. -->
  <div id="detail" aria-live="polite">
    <div id="detail-shot" class="is-empty" aria-hidden="true"></div>
    <div id="detail-title">&mdash;</div>
    <div id="detail-meta"></div>
    <p id="detail-synopsis">Pick a disk to see what is on it.</p>
  </div>

  <!-- ⚠️ THE TWO-STEP INSERT IS EXPLAINED NOWHERE ELSE. This sentence lived on
       `#box-label` ("Disk Box — click a disk, then Insert") until the box became
       two crates. Picking a disk up and committing to it are deliberately
       separate actions (core spec, Interaction Model 2), which is not guessable
       from looking at a crate — so the words move, they do not get dropped. -->
  <p id="crates-hint">Click a disk, then <strong>Insert</strong>.</p>
</div><!-- /#crates -->

</div><!-- /#cat -->

<!-- ---- a cartridge running in-hub --------------------------------------
     An overlay, deliberately NOT a navigation. The hub stays alive
     underneath, so returning is a hide rather than a reload: no second boot
     sequence, no flash, and the disk is still in the drive where it was
     left. The iframe's src is emptied on exit so the cartridge is really
     stopped rather than left running behind a hidden panel. -->
<div id="play" hidden>
  <div id="play-bar">
    <span>Running</span>
    <span id="play-title"></span>
    <!-- Disk swapping for multi-disk C64 titles. Hidden for cartridges and
         for single-disk titles alike — the hub grows the control only when
         there is genuinely another side to swap to. Populated by cat.js. -->
    <span id="play-disks" role="group" aria-label="Disk side" hidden></span>
    <!-- INPUT MODE. Joystick and keyboard are mutually exclusive inside
         EmulatorJS, so this is a mode SWITCH rather than a preference, and the
         label always names the mode that is LIVE. Without it a dead joystick
         reads as a broken game and a dead keyboard reads as a dead key.
         Painted from the cartridge's own report, never assumed - see emu.js. -->
    <button class="btn" id="btn-input" type="button" hidden aria-live="polite"
            title="Switch between joystick and keyboard (F2)">Input: &mdash;</button>
    <!-- JOYSTICK PORT. A C64 has two, and the disk does not say which one it
         reads: Port 2 is the usual choice and a real minority use Port 1, with
         no list to look it up in. It sits beside the input switch because it
         answers the same question the player is actually asking - "why is
         nothing happening?" - and it has to be reachable while the dead stick
         is in front of them. Painted from the cartridge's own report, never
         assumed, exactly like the one above. -->
    <button class="btn" id="btn-port" type="button" hidden aria-live="polite"
            title="Switch which joystick port the stick is in (F9)">Port: &mdash;</button>
    <button class="btn" id="btn-exit" type="button">Exit to CAT</button>
  </div>
  <iframe id="play-frame" title="Cartridge" src="about:blank"></iframe>
</div>

<p class="sr-only" id="help-text">
  The CAT terminal accepts typed commands. Type LOAD, quote, a program name,
  quote, comma 8 and press Enter to load it, or LOAD "$",8 to list the
  inserted disk.
</p>

<!-- 🚨 LOAD ORDER IS LOAD-BEARING, and only in one direction: cat.js reads
     window.CAT_DISKS, window.CAT_LIBRARY, window.CAT_GAMEINFO and
     window.CAT_CRACK at IIFE time, so all four must be defined before it. The
     first four are independent of each other and may be reordered freely;
     cat.js must stay last.
     ⭐ A missing crackintro.js, library.js or games.js is a SUPPORTED state —
     cat.js stands in for all three rather than failing — but a cat.js that runs
     first would silently lose the disk library with nothing on screen to say
     so. 🆕 games.js joined this list 2026-09-11; it is the screenshot and
     synopsis the detail panel shows, and without it every disk simply reads as
     having no entry yet, which is already the common case. -->
<script src="disks.js"></script>
<script src="library.js"></script>
<script src="games.js"></script>
<script src="crackintro.js"></script>
<script src="cat.js"></script>
</body>
</html>
