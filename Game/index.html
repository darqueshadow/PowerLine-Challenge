<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerLine Challenge — Training Console</title>
    <link rel="stylesheet" href="styles/main-menu.css">
</head>
<body>

<!--
    ================================================================
    CRT FLICKER TRANSITION
    
    Appears when transitioning from main menu to submenu.
    Shows for 300-600ms with static/flicker effect, then hides.
    ================================================================
-->
<div id="crt-transition" aria-hidden="true"></div>

<!--
    ================================================================
    CASSETTE LOAD SCREEN
    
    PET/Commodore-style loading screen shown when launching a cassette.
    ================================================================
-->
<div id="cassette-load-screen" aria-hidden="true">
    <div class="cassette-load-content">
        <p id="cassette-load-line-1">READY.</p>
        <p id="cassette-load-line-2">LOAD "BLANK CASSETTE",8,1</p>
        <p id="cassette-load-line-3">RUN</p>
    </div>
</div>


<!--
    ================================================================
    PLC MAIN MENU CONTAINER
    
    The main menu screen with the computer illustration.
    ================================================================
-->
<div id="plc-container">

    <!-- The computer illustration — sizes itself to fit the viewport -->
    <img id="bg-image" src="assets/images/Main_Menu.png" alt="PowerLine Challenge Training Console">

    <!--
        ============================================================
        CASSETTE TRAY CLICK ZONE
        ============================================================
    -->
    <div id="tray-click-zone"
         role="button"
         tabindex="0"
         aria-label="Browse cartridges"
         aria-expanded="false">
    </div>

    <!-- ================================================================
         THE ARCADE, ON THE FRONT DOOR — 2026-09-11.

         🚨 THE LINK IN THE DECK-CONTROLS ROW IS NOT ENOUGH, and a screenshot
         is what said so: that row lives inside the cassette SUBMENU, which is
         hidden until you click the tray. This screen — the Tommodore CAT
         illustration — is what a browser actually opens, and it is where he
         landed on a work machine and concluded the arcade was broken. A route
         nobody can see from the front door is not a route.

         ⚠️ Deliberately OUTSIDE `#tray-click-zone`: that zone is a big
         invisible hit area over the cassette rack, and a link inside it would
         be swallowed by the tray's own handler.
         ================================================================ -->
    <a id="to-arcade" class="arcade-link" href="cat/index.html"
       aria-label="Open the Tommodore CAT arcade">
        ► ARCADE
    </a>

</div><!-- end #plc-container -->


<!--
    ================================================================
    CARTRIDGE SUBMENU
    
    The cassette-based game selection screen.
    Hidden by default, shown after CRT transition.
    ================================================================
-->
<section id="cartridge-submenu" aria-hidden="true">

    <!-- Header -->
    <div id="submenu-header">
        <h1 id="submenu-title">Select a Game Cassette</h1>
    </div>

    <!-- Main content area with 3 panels -->
    <div id="submenu-content">
        
        <!-- Left: Screenshot Panel -->
        <div id="game-screenshot-panel">
            <img id="game-screenshot" 
                 src="assets/images/coming-soon-placeholder.svg" 
                 alt="Game screenshot">
        </div>

        <!-- Center: Cassette Row (horizontal scrolling) -->
        <div id="cassette-row-container">
            <div id="cassette-row">
                <!-- Cassettes injected here by submenu.js -->
            </div>
        </div>

        <!-- Right: Game Info Panel -->
        <div id="game-info-panel">
            <h2 id="game-title">—</h2>
            <p id="game-synopsis">Select a cassette to view details.</p>
            <div id="game-status"></div>
        </div>

    </div>

    <!-- Bottom: Cassette Deck with Controls -->
    <div id="cassette-deck-area">
        
        <img id="cassette-deck" 
             src="assets/images/Cassette_Deck.png" 
             alt="Cassette Deck">

        <div id="deck-controls">
            <button id="back-to-main" aria-label="Back to Main Menu">
                ◄ BACK
            </button>
            <button id="start-cartridge" disabled aria-label="Start Game">
                Select a cassette to begin
            </button>

            <!-- ================================================================
                 THE ARCADE — added 2026-09-11 because there was NO WAY IN.

                 🚨 Measured before it was built: this Console contained zero
                 links to `cat/`, so the Tommodore CAT arcade was reachable only
                 by typing its URL or through `fangrock://arcade` in the Fang
                 Rock shell. Opening this repo in an ordinary browser therefore
                 landed on this cassette screen with no hint the arcade existed —
                 which is exactly what happened to him on a work machine, and
                 read as "the arcade is broken" rather than "the arcade is
                 elsewhere".

                 ⚠️ A PLAIN <a>, NOT A BUTTON THAT SCRIPTS A NAVIGATION. The
                 arcade is a different application, not a cassette: it is its own
                 page with its own boot. A real link works with middle-click,
                 shows its target in the status bar, and — the part that matters
                 here — still works if this Console's JS has not loaded.

                 📌 It is styled as a third deck control rather than given a new
                 look, because it sits in the row a player is already using to
                 choose something to play.
                 ================================================================ -->
            <a id="to-arcade-deck" class="arcade-link" href="cat/index.html"
               aria-label="Open the Tommodore CAT arcade">
                ► ARCADE
            </a>
        </div>

    </div>

</section><!-- end #cartridge-submenu -->


<script src="core/main-menu.js"></script>
<script src="core/submenu.js"></script>
</body>
</html>
